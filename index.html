<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="container">
        <h1 id="heading">How Are You Feeling Today?</h1>

        <button onclick="happyMood()" id="happy">😊 Happy</button>
        <button onclick="sadMood()" id="sad">😔 Sad</button>
        <button onclick="angryMood()" id="angry">😡 Angry</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
